name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Build release
        run: swift build -c release --product MacGlass
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Verify signature
        run: codesign --verify --deep --strict dist/MacGlass.app
